name: Manual APK Build
on:
  workflow_dispatch:

jobs:
  build:     
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android
      - run: cargo install cargo-ndk
      - uses: android-actions/setup-android@v3  
        with:
          packages: ''
      - run: sdkmanager "ndk;29.0.14206865" "platforms;android-37" "build-tools;37.0.0"
      - run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-output
          path: android/app/build/outputs/apk/**/*.apk
