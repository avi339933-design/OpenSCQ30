name: Create Debug Keystore
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/create-debug-keystore.yml'

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create and commit keystore
        run: |
          if [ -f android/lite/debug.keystore ]; then
            echo "android/lite/debug.keystore already exists, nothing to do"
            exit 0
          fi
          keytool -genkeypair -v \
            -keystore android/lite/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f android/lite/debug.keystore
          git commit -m "Add fixed debug keystore"
          git push
